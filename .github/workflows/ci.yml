name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # Não bloqueia ainda: o projeto tem débito de lint pré-existente (~47 erros em
      # arquivos fora do escopo do Romsales pro, tipo audit.ts/alerts.ts/sanitizer.ts)
      # que nunca foi gateado. Continua rodando e visível no log, só não derruba o CI
      # até esse débito ser limpo à parte — daí é só tirar o continue-on-error.
      - run: npm run lint
        continue-on-error: true

      # src/__tests__ (smoke/e2e/integration) precisa de servidor local rodando em
      # :3000 + segredos reais (DATABASE_URL, CRON_SECRET) — não é isolado, não roda
      # em CI sem essa infra própria. src/lib/** é unit puro, sem dependência externa
      # — é o que valida de verdade em CI por enquanto.
      - run: npx vitest run src/lib

      # Mesmo typecheck que a Vercel roda no deploy — pega em CI, não em produção.
      - run: npm run build
        env:
          # Só pra satisfazer checagens de env em build-time — nenhum destes é usado de verdade em CI.
          ROMSALES_PRO_SESSION_SECRET: ci-build-only-not-a-real-secret
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
